<!doctype html><html lang="ko"><meta charset="utf-8"><title>Workspace import and save tests</title><style>body{font:14px system-ui}iframe{width:100%;height:550px;border:1px solid #ddd}.fail{color:#b00}</style><h1>문서 가져오기·저장 검사</h1><p id="summary">실행 중…</p><ol id="results"></ol><iframe title="격리된 테스트 문서함"></iframe><script type="module">
const key='sohjae.test.'+crypto.randomUUID(),frame=document.querySelector('iframe');let passed=0,failed=0;
const assert=(value,message)=>{if(!value)throw Error(message);};
const wait=async test=>{const end=Date.now()+15000;while(Date.now()<end){if(test())return;await new Promise(resolve=>setTimeout(resolve,20));}throw Error('Timed out');};
const run=async(name,body)=>{const li=document.createElement('li');document.querySelector('#results').append(li);try{await body();passed++;li.textContent='PASS '+name;}catch(error){failed++;li.className='fail';li.textContent='FAIL '+name+': '+error.stack;}};
const html=await (await fetch('./index.html')).text();frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('./',location.href).href+'">').replace('<body ','<body data-storage-key="'+key+'" ');
await new Promise(resolve=>frame.onload=resolve);const win=frame.contentWindow,doc=frame.contentDocument;
const files=(names)=>{const transfer=new win.DataTransfer();for(const [name,source] of names)transfer.items.add(new win.File([source],name,{type:'text/markdown'}));return transfer;};
const drop=(target,entries)=>target.dispatchEvent(new win.DragEvent('drop',{dataTransfer:files(entries),bubbles:true,cancelable:true,composed:true}));
const state=()=>JSON.parse(localStorage.getItem(key));
await run('Splash file drop loads app and imports multiple documents without overwriting',async()=>{drop(win,[['보고서.md','# 보고서\n\n**원문**😀'],['보고서.md','둘째 원문']]);await wait(()=>state()?.nodes.filter(n=>n.name==='보고서.md').length===2);assert(!doc.querySelector('#workspace').hidden,'workspace did not open');const entries=state().nodes.filter(n=>n.name==='보고서.md');assert(entries[0].markdown==='# 보고서\n\n**원문**😀','source changed');assert(entries[1].markdown==='둘째 원문','duplicate filename overwritten');});
await run('Dropping Markdown on a folder creates its child document',async()=>{const folder=state().nodes.find(n=>n.type==='folder'),row=doc.querySelector('[data-id="'+folder.id+'"]');drop(row,[['하위.MD','한글 내용']]);await wait(()=>state()?.nodes.some(n=>n.name==='하위.MD'));assert(state().nodes.find(n=>n.name==='하위.MD').parent===folder.id,'wrong parent');});
await run('Cmd/Ctrl+S and toolbar use the renamed document filename',async()=>{doc.querySelector('#doc-title').click();const input=doc.querySelector('.rename-input');input.value='새 이름.md';input.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));const downloads=[];const nativeClick=win.HTMLAnchorElement.prototype.click;win.HTMLAnchorElement.prototype.click=function(){downloads.push(this.download);};for(const modifier of ['ctrlKey','metaKey'])doc.dispatchEvent(new win.KeyboardEvent('keydown',{key:'s',code:'KeyS',[modifier]:true,bubbles:true,cancelable:true}));const host=doc.querySelector('#editor');host.shadowRoot.querySelector('[data-command="save"]').click();win.HTMLAnchorElement.prototype.click=nativeClick;assert(downloads.length===3,'duplicate or missing downloads: '+downloads.length);assert(downloads.every(name=>name==='새 이름.md'),'wrong filename: '+downloads.join(', '));});
await run('Inactive document menu downloads that document without switching',async()=>{const before=state(),other=before.nodes.find(n=>n.name==='보고서.md'),row=doc.querySelector('[data-id="'+other.id+'"]'),downloads=[];let blob;const nativeClick=win.HTMLAnchorElement.prototype.click,nativeURL=win.URL.createObjectURL;win.HTMLAnchorElement.prototype.click=function(){downloads.push(this.download);};win.URL.createObjectURL=value=>{blob=value;return nativeURL.call(win.URL,value);};try{row.dispatchEvent(new win.MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:100,clientY:200}));const button=[...doc.querySelectorAll('#menu button')].find(n=>n.textContent==='다운로드하기');assert(button,'download menu missing');button.click();assert(downloads[0]===other.name,'wrong menu filename');assert(await blob.text()===other.markdown,'wrong document content');assert(state().active===before.active,'menu download switched active document');}finally{win.HTMLAnchorElement.prototype.click=nativeClick;win.URL.createObjectURL=nativeURL;}});
await run('Plus menu upload imports selected Markdown files',async()=>{doc.querySelector('#add').click();assert([...doc.querySelectorAll('#menu button')].some(n=>n.textContent==='업로드하기'),'upload menu missing');const input=doc.querySelector('#upload-files');assert(input.multiple,'multi-file selection missing');input.files=files([['선택 업로드.md','# 선택한 문서😀']]).files;input.dispatchEvent(new win.Event('change',{bubbles:true}));await wait(()=>state()?.nodes.some(n=>n.name==='선택 업로드.md'));const imported=state().nodes.find(n=>n.name==='선택 업로드.md');assert(imported.markdown==='# 선택한 문서😀','uploaded content changed');assert(imported.parent===null,'plus upload should target root');assert(input.files.length===0,'file input not reset for repeated uploads');});
document.querySelector('#summary').textContent=passed+' passed / '+failed+' failed';localStorage.removeItem(key);
</script></html>
