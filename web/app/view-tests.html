<!doctype html><html lang="ko"><meta charset="utf-8"><title>Reading themes and visible outline tests</title><style>body{font:14px system-ui}iframe{width:100%;height:650px;border:1px solid #ddd}.fail{color:#b00}</style><h1>읽기 테마·화면 목차 검사</h1><p id="summary">실행 중…</p><ol id="results"></ol><div id="frames"></div><script type="module">
import{initialWorkspace}from'./store.js';const key='sohjae.view-test.'+crypto.randomUUID(),data=initialWorkspace();data.nodes.find(n=>n.type==='document').markdown='# 첫 제목\n\n## 둘째 제목\n\n### 셋째 제목\n\n**본문**과 ==강조==를 표시합니다.\n\n'+('긴 본문 문단입니다.\n\n').repeat(30);localStorage.setItem(key,JSON.stringify(data));let passed=0,failed=0;const assert=(ok,message)=>{if(!ok)throw Error(message);};const wait=async test=>{for(let i=0;i<400;i++){if(test())return;await new Promise(r=>setTimeout(r,20));}throw Error('Timed out');};const run=async(name,body)=>{const li=document.createElement('li');document.querySelector('#results').append(li);try{await body();passed++;li.textContent='PASS '+name;}catch(error){failed++;li.className='fail';li.textContent='FAIL '+name+': '+error.stack;}};const html=await(await fetch('./index.html')).text();const f=document.createElement('iframe');f.srcdoc=html.replace('<head>','<head><base href="'+new URL('./',location.href).href+'">').replace('<body ','<body data-storage-key="'+key+'" ');document.querySelector('#frames').append(f);await new Promise(r=>f.onload=r);const d=f.contentDocument,w=f.contentWindow;d.querySelector('#start').click();await wait(()=>!d.querySelector('#workspace').hidden);const select=(id,value)=>{const input=d.querySelector(id);input.value=value;input.dispatchEvent(new w.Event('change'));};
await run('Reading mode shows only renderer and outline',async()=>{select('#layout','read');assert(d.querySelector('#editor-pane').hidden,'editor still visible');assert(!d.querySelector('#preview-pane').hidden,'preview hidden');assert(!d.querySelector('#reading-theme-label').hidden,'theme selector hidden');assert(d.querySelector('#preview h1').textContent==='첫 제목','renderer content missing');});
await run('All headings visible in the viewport are highlighted',async()=>{await new Promise(r=>w.requestAnimationFrame(r));const pane=d.querySelector('#preview-scroll'),rect=pane.getBoundingClientRect(),visible=[...d.querySelectorAll('#preview h1,#preview h2,#preview h3')].filter(h=>h.getBoundingClientRect().top<rect.bottom&&h.getBoundingClientRect().bottom>rect.top);assert(visible.length>=2,'test needs multiple visible headings');const active=[...d.querySelectorAll('#toc-links .current')].map(n=>n.dataset.heading);assert(visible.every(h=>active.includes(h.id)),'not all visible headings highlighted');assert(active.length===visible.length,'invisible heading highlighted');});
await run('Ten distinct reading palettes including ivory and dark orange',async()=>{const colors=new Set(),theme=d.querySelector('#reading-theme');assert(theme.options.length===10,'not ten themes');for(const option of theme.options){select('#reading-theme',option.value);colors.add(w.getComputedStyle(d.querySelector('#panes')).backgroundColor);}assert(colors.size===10,'palettes not distinct');select('#reading-theme','ember');assert(w.getComputedStyle(d.querySelector('#panes')).backgroundColor==='rgb(20, 20, 20)','dark orange background mismatch');});
await run('Dark mode changes application and editor without changing source',async()=>{d.querySelector('#appearance').click();assert(d.body.dataset.appearance==='dark','dark mode missing');assert(d.querySelector('#editor').hasAttribute('data-dark'),'editor skin missing');const saved=JSON.parse(localStorage.getItem(key));assert(saved.appearance==='dark'&&saved.layout==='read'&&saved.readingTheme==='ember','settings not persisted');assert(saved.nodes.find(n=>n.type==='document').markdown===data.nodes.find(n=>n.type==='document').markdown,'source changed');});
await run('Printing uses only the active semantic document in every layout',async()=>{for(const layout of ['full','markdown','source','read']){select('#layout',layout);const previous=JSON.stringify(JSON.parse(localStorage.getItem(key)).nodes);w.dispatchEvent(new w.Event('beforeprint'));const article=d.querySelector('#print-document');assert(article.querySelectorAll('h1,h2,h3').length===3,'print headings missing: '+layout);assert(!article.textContent.includes('웹 브라우저 저장소'),'workspace chrome in print');assert(!article.querySelector('section[data-block],[data-text]'),'editor coordinate wrappers in print');assert(d.querySelector('#layout').value===layout,'printing changed layout');assert(JSON.stringify(JSON.parse(localStorage.getItem(key)).nodes)===previous,'printing changed document');w.dispatchEvent(new w.Event('afterprint'));assert(!article.childNodes.length,'print copy not cleared');}});
document.querySelector('#summary').textContent=passed+' passed / '+failed+' failed';
</script></html>
