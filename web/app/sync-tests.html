<!doctype html><html lang="ko"><meta charset="utf-8"><title>Automatic browser sync tests</title><style>body{font:14px system-ui}#frames{display:flex}iframe{width:50%;height:560px;border:1px solid #ddd}.fail{color:#b00}</style><h1>자동 탭 동기화 검사</h1><p id="summary">실행 중…</p><ol id="results"></ol><div id="frames"></div><script type="module">
import {initialWorkspace} from './store.js';
const key='sohjae.sync-test.'+crypto.randomUUID(),seed=initialWorkspace();seed.nodes.find(n=>n.type==='document').markdown='기준';localStorage.setItem(key,JSON.stringify(seed));let passed=0,failed=0;
const assert=(ok,message='assertion failed')=>{if(!ok)throw Error(message);};const wait=async check=>{const end=Date.now()+20000;while(Date.now()<end){if(check())return;await new Promise(r=>setTimeout(r,30));}throw Error('Timed out');};const run=async(name,body)=>{const li=document.createElement('li');document.querySelector('#results').append(li);try{await body();passed++;li.textContent='PASS '+name;}catch(error){failed++;li.className='fail';li.textContent='FAIL '+name+': '+error.stack;}};
const html=await(await fetch('./index.html')).text();async function context(){const f=document.createElement('iframe');f.srcdoc=html.replace('<head>','<head><base href="'+new URL('./',location.href).href+'">').replace('<body ','<body data-storage-key="'+key+'" ');document.querySelector('#frames').append(f);await new Promise(r=>f.onload=r);const d=f.contentDocument,w=f.contentWindow;d.querySelector('#start').click();await wait(()=>!d.querySelector('#workspace').hidden);const layout=d.querySelector('#layout');layout.value='source';layout.dispatchEvent(new w.Event('change'));return {f,d,w};}
const a=await context(),b=await context();const source=c=>c.d.querySelector('#editor').shadowRoot?.querySelector('textarea.source');const edit=(c,text)=>{const input=source(c);input.value=text;input.setSelectionRange(text.length,text.length);input.dispatchEvent(new c.w.Event('input',{bubbles:true}));};
await run('Concurrent edits converge without overwriting either insertion',async()=>{edit(a,'A기준');edit(b,'기준B');await wait(()=>source(a)?.value==='A기준B'&&source(b)?.value==='A기준B');});
await run('Folder and document creation synchronizes without switching the other context',async()=>{const previous=b.d.querySelector('#doc-title').textContent;a.d.querySelector('#add').click();[...a.d.querySelectorAll('#menu button')].find(n=>n.textContent==='문서 추가하기').click();await wait(()=>a.d.querySelector('.rename-input'));const input=a.d.querySelector('.rename-input');input.value='탭 공유.md';input.dispatchEvent(new a.w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));await wait(()=>[...b.d.querySelectorAll('.node-name')].some(n=>n.textContent==='탭 공유.md'));assert(b.d.querySelector('#doc-title').textContent===previous,'remote document selection replaced local selection');await wait(()=>source(a)&&a.d.querySelector('#editor').style.visibility!=='hidden');});
await run('Inactive document updates appear when opened',async()=>{edit(a,'새 문서 내용😀');await wait(()=>JSON.parse(localStorage.getItem(key)).nodes.some(n=>n.name==='탭 공유.md'&&n.markdown==='새 문서 내용😀'));[...b.d.querySelectorAll('.node-name')].find(n=>n.textContent==='탭 공유.md').click();await wait(()=>source(b)?.value==='새 문서 내용😀');});
await run('Local undo preserves the other context edits',async()=>{edit(a,'새 문서 내용😀A');await wait(()=>source(b)?.value==='새 문서 내용😀A');edit(b,'B새 문서 내용😀A');await wait(()=>source(a)?.value==='B새 문서 내용😀A');const input=source(a);input.dispatchEvent(new a.w.KeyboardEvent('keydown',{key:'z',code:'KeyZ',ctrlKey:true,bubbles:true,cancelable:true}));await wait(()=>source(a)?.value==='B새 문서 내용😀'&&source(b)?.value==='B새 문서 내용😀');});
await run('Reload restores the merged CRDT without duplicated text',async()=>{const f=b.f;const text=source(a).value;const c=await context();await wait(()=>source(c)?.value===text);c.f.remove();});
await run('Idle contexts do not echo storage notifications indefinitely',async()=>{await new Promise(r=>setTimeout(r,700));const before=JSON.parse(localStorage.getItem(key)).revision;await new Promise(r=>setTimeout(r,400));assert(JSON.parse(localStorage.getItem(key)).revision===before,'idle storage revision kept increasing');});
document.querySelector('#summary').textContent=passed+' passed / '+failed+' failed';
</script></html>
